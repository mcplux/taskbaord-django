services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: "taskboard_django_postgres"
    environment:
      POSTGRES_DB: ${DB_NAME:?Postgres DB name is required}
      POSTGRES_USER: ${DB_USER:?Postgres user is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Postgres password is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    container_name: "taskboard_django_adminer"
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
