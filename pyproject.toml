[project]
name = "taskboard-django"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.2",
    "django-stubs-ext>=6.1.2",
    "django-vite>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "DJ",
    "SIM",
    "C4",
    "PT",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["\\.venv/", "node_modules/", "/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "django_browser_reload.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["apps"]
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db --cov --cov-report=term-missing:skip-covered --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
