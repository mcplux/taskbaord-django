{% extends "base.html" %}

{% block body_class %}flex flex-col{% endblock %}

{% block content %}
  <main class="mx-auto grid w-full max-w-5xl flex-1 content-center items-center gap-10 px-6 py-12 md:grid-cols-2 md:gap-16 md:py-16">
    <aside class="hidden md:block">
      <h2 class="bg-linear-to-r from-indigo-600 to-purple-600 bg-clip-text text-3xl leading-tight font-bold tracking-tight text-transparent sm:text-4xl sm:leading-tight dark:from-indigo-300 dark:to-purple-300">
        {% block aside_title %}{% endblock %}
      </h2>
      <p class="mt-4 text-lg text-slate-600 dark:text-slate-300">
        {% block aside_body %}{% endblock %}
      </p>
      <ul class="mt-8 space-y-5">
        {% block aside_items %}{% endblock %}
      </ul>
    </aside>

    <section class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-lg sm:p-8 dark:border-slate-700 dark:bg-slate-900">
      {% block panel %}{% endblock %}
    </section>
  </main>
{% endblock %}
