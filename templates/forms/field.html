<div>
  {% if field.widget_type == "checkbox" %}
    <div class="flex items-center gap-2">
      {{ field }}
      <label for="{{ field.id_for_label }}" class="text-sm">{{ field.label }}</label>
    </div>
  {% else %}
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}
    <div id="{{ field.auto_id }}_helptext" class="mt-1 text-xs text-slate-500 dark:text-slate-400 [&_ul]:list-disc [&_ul]:space-y-0.5 [&_ul]:pl-4">
      {{ field.help_text|safe }}
    </div>
  {% endif %}
  {% if field.errors %}
    <ul id="{{ field.auto_id }}_error" class="mt-1 space-y-0.5 text-sm text-red-600 dark:text-red-400">
      {% for error in field.errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</div>
