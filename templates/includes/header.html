{% load i18n %}
<header class="border-b border-slate-200 dark:border-slate-700">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-6 py-4">
    <a href="{% url 'cms:home' %}" class="text-2xl font-bold">Taskboard</a>
    <div class="flex items-center gap-6">
      <nav aria-label="{% translate 'Main' %}">
        <ul class="flex gap-6 text-sm font-medium">
          <li><a href="{% url 'cms:home' %}" class="hover:underline">{% translate "Home" %}</a></li>
          <li><a href="#" class="hover:underline">{% translate "About" %}</a></li>
          <li><a href="#" class="hover:underline">{% translate "Log in" %}</a></li>
        </ul>
      </nav>
      <button type="button" x-data @click="$store.theme.cycle()"
              aria-label="{% translate 'Change theme' %}" title="{% translate 'Change theme' %}"
              class="inline-flex size-9 cursor-pointer items-center justify-center rounded-md hover:bg-slate-200 dark:hover:bg-slate-700">
        <span x-cloak x-show="$store.theme.mode === 'light'" class="icon-[lucide--sun] size-5"
              aria-hidden="true"></span>
        <span x-cloak x-show="$store.theme.mode === 'dark'" class="icon-[lucide--moon] size-5"
              aria-hidden="true"></span>
        <span x-cloak x-show="$store.theme.mode === 'system'" class="icon-[lucide--monitor] size-5"
              aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
